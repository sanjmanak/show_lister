<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
      background: #0a0a0f;
    }
    .photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60%;
      object-fit: cover;
      object-position: center 15%;
    }
    .gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45%;
      background: linear-gradient(
        to bottom,
        rgba(10, 10, 15, 0) 0%,
        rgba(10, 10, 15, 0.6) 25%,
        rgba(10, 10, 15, 0.92) 60%,
        rgba(10, 10, 15, 1) 100%
      );
    }
    .content {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0 48px 60px;
      z-index: 2;
    }
    .accent-line {
      width: 40px;
      height: 3px;
      background: #ff4d6a;
      margin-bottom: 16px;
    }
    .name {
      font-size: 56px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .details {
      font-size: 24px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.5;
    }
    .brand {
      position: absolute;
      bottom: 24px;
      left: 48px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #ff4d6a;
      opacity: 0.7;
      z-index: 2;
    }
  </style>
</head>
<body>
  <img class="photo" src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1145033293%2F308508386880%2F1%2Foriginal.20251005-163254?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=0ac2c42c515f50824b7fa37c6a54fbcf" alt="Matthew Broussard">
  <div class="gradient"></div>
  <div class="content">
    <div class="accent-line"></div>
    <div class="name">Matthew Broussard</div>
    <div class="details">The Gordy<br>Friday, April 3, 2026</div>
  </div>
  <div class="brand">COMEDYHOUSTON.COM</div>
</body>
</html>
