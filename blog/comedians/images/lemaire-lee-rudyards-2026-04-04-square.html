<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      position: relative;
      background: #0a0a0f;
    }
    .photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70%;
      object-fit: cover;
      object-position: center 20%;
    }
    .gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(
        to bottom,
        rgba(10, 10, 15, 0) 0%,
        rgba(10, 10, 15, 0.6) 25%,
        rgba(10, 10, 15, 0.92) 60%,
        rgba(10, 10, 15, 1) 100%
      );
    }
    .content {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0 48px 40px;
      z-index: 2;
    }
    .accent-line {
      width: 40px;
      height: 3px;
      background: #ff4d6a;
      margin-bottom: 16px;
    }
    .name {
      font-size: 48px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    .details {
      font-size: 20px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.5;
    }
    .brand {
      position: absolute;
      bottom: 16px;
      left: 48px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #ff4d6a;
      opacity: 0.7;
      z-index: 2;
    }
  </style>
</head>
<body>
  <img class="photo" src="https://portcomedy.com/wp-content/uploads/2024/11/Photo-Feb-28-2025-8-45-12-PM-960x1200.webp" alt="Lemaire Lee">
  <div class="gradient"></div>
  <div class="content">
    <div class="accent-line"></div>
    <div class="name">Lemaire Lee</div>
    <div class="details">Rudyard's<br>Saturday, April 4, 2026</div>
  </div>
  <div class="brand">COMEDYHOUSTON.COM</div>
</body>
</html>
