<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .bg-accent {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
    }
    .bg-accent-1 { background: #ff4d6a; top: -150px; right: -100px; }
    .bg-accent-2 { background: #7c5cff; bottom: -150px; left: -100px; }
    .header-label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #ff4d6a;
      margin-bottom: 8px;
      z-index: 1;
    }
    .title {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 36px;
      z-index: 1;
      text-align: center;
    }
    .headshot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px 40px;
      z-index: 1;
      margin-bottom: 28px;
      max-width: 720px;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .grid-item img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 77, 106, 0.5);
    }
    .grid-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      max-width: 180px;
    }
    .extra-lineup {
      display: flex;
      gap: 16px;
      z-index: 1;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }
    .extra-name {
      font-size: 16px;
      font-weight: 600;
      color: #9999aa;
      padding: 2px 12px;
      border-left: 2px solid #ff4d6a;
    }
    .week-range {
      font-size: 20px;
      font-weight: 500;
      color: #9999aa;
      z-index: 1;
    }
    .brand {
      position: absolute;
      bottom: 28px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #666677;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-accent bg-accent-1"></div>
  <div class="bg-accent bg-accent-2"></div>
  <div class="header-label">This Week In</div>
  <div class="title">Houston Comedy</div>
  <div class="headshot-grid">
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1179776137%2F428099579998%2F1%2Foriginal.20260313-140120?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=d423ed7d63474efaea9c8233fe5abb34" alt="Shawn Gardini">
        <div class="grid-name">Shawn Gardini</div>
      </div>
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1178148273%2F428099579998%2F1%2Foriginal.20260222-191415?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=e3a7872a9fede2198490eff1a821d3d0" alt="Isabel Hagen">
        <div class="grid-name">Isabel Hagen</div>
      </div>
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1145033293%2F308508386880%2F1%2Foriginal.20251005-163254?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=0ac2c42c515f50824b7fa37c6a54fbcf" alt="Matthew Broussard">
        <div class="grid-name">Matthew Broussard</div>
      </div>
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1175781694%2F428099579998%2F1%2Foriginal.20260125-195307?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=dd8dc520e1ef79c87c2192382e5ec6b0" alt="Lemaire Lee">
        <div class="grid-name">Lemaire Lee</div>
      </div>
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1175254598%2F428099579998%2F1%2Foriginal.20260119-170009?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=22f6e9a1394ff81c837ba27bbe12aad9" alt="Nate Marshall">
        <div class="grid-name">Nate Marshall</div>
      </div>
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1175682981%2F428099579998%2F1%2Foriginal.20260123-210032?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=a3da01969564272852e62a4d57cd334e" alt="Tommy Pope">
        <div class="grid-name">Tommy Pope</div>
      </div>
  </div>

  <div class="week-range">March 30 – April 5, 2026</div>
  <div class="brand">COMEDYHOUSTON.COM</div>
</body>
</html>
