<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .bg-accent {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
    }
    .bg-accent-1 { background: #ff4d6a; top: -150px; right: -100px; }
    .bg-accent-2 { background: #7c5cff; bottom: -150px; left: -100px; }
    .header-label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #ff4d6a;
      margin-bottom: 8px;
      z-index: 1;
    }
    .title {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 36px;
      z-index: 1;
      text-align: center;
    }
    .headshot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px 40px;
      z-index: 1;
      margin-bottom: 28px;
      max-width: 720px;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .grid-item img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 77, 106, 0.5);
    }
    .grid-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      max-width: 180px;
    }
    .extra-lineup {
      display: flex;
      gap: 16px;
      z-index: 1;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }
    .extra-name {
      font-size: 16px;
      font-weight: 600;
      color: #9999aa;
      padding: 2px 12px;
      border-left: 2px solid #ff4d6a;
    }
    .week-range {
      font-size: 20px;
      font-weight: 500;
      color: #9999aa;
      z-index: 1;
    }
    .brand {
      position: absolute;
      bottom: 28px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #666677;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-accent bg-accent-1"></div>
  <div class="bg-accent bg-accent-2"></div>
  <div class="header-label">This Week In</div>
  <div class="title">Houston Comedy</div>
  <div class="headshot-grid">
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/9c9/95f79627-f9d8-4468-859f-9e2c1ec549c9_SOURCE" alt="Emma Willmann">
        <div class="grid-name">Emma Willmann</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/378/6a83fd48-d1ba-4955-bb12-7c8ae48dd378_SOURCE" alt="Rick Glassman">
        <div class="grid-name">Rick Glassman</div>
      </div>
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1178040499%2F3558237521%2F1%2Foriginal.20260220-170459?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=e533c8fd0a5545553df71fdc4ddb31e3" alt="Saul Trujillo">
        <div class="grid-name">Saul Trujillo</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/c/50a/fa9caa1f-73a1-411e-b507-ec56fa59650a_106061_TABLET_LANDSCAPE_LARGE_16_9.jpg" alt="Josh Johnson">
        <div class="grid-name">Josh Johnson</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/285/636a6b15-758f-487c-81d0-d829cbe3e285_SOURCE" alt="Ron White">
        <div class="grid-name">Ron White</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/a44/52d121bc-785d-4051-a8f6-23eafc0f8a44_SOURCE" alt="Jimmy Dore">
        <div class="grid-name">Jimmy Dore</div>
      </div>
  </div>
  <div class="extra-lineup">
      <span class="extra-name">Michael McIntyre</span>
  </div>
  <div class="week-range">March 23 – March 29, 2026</div>
  <div class="brand">COMEDYHOUSTON.COM</div>
</body>
</html>
