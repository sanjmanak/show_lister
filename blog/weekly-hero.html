<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .bg-accent {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
    }
    .bg-accent-1 { background: #ff4d6a; top: -150px; right: -100px; }
    .bg-accent-2 { background: #7c5cff; bottom: -150px; left: -100px; }
    .header-label {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #ff4d6a;
      margin-bottom: 10px;
      z-index: 1;
    }
    .title {
      font-size: 62px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 46px;
      z-index: 1;
      text-align: center;
    }
    /* The headshots are the content — size them up so they fill the 1080×1080
       frame instead of floating in dead space (matches the "pinch to zoom"
       crop an operator would otherwise do by hand before posting). */
    .headshot-grid {
      display: grid;
      gap: 34px 54px;
      z-index: 1;
      margin-bottom: 38px;
      justify-items: center;
    }
    .headshot-grid.cols-1 { grid-template-columns: 1fr; max-width: 420px; }
    .headshot-grid.cols-2 { grid-template-columns: repeat(2, 1fr); max-width: 720px; }
    .headshot-grid.cols-3 { grid-template-columns: repeat(3, 1fr); max-width: 920px; gap: 34px 54px; }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .grid-item img {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 77, 106, 0.5);
    }
    /* When fewer comedians are featured, give each one even more visual weight. */
    .headshot-grid.cols-2 .grid-item img,
    .headshot-grid.cols-1 .grid-item img {
      width: 330px;
      height: 330px;
      border-width: 5px;
    }
    .headshot-grid.cols-2 .grid-name,
    .headshot-grid.cols-1 .grid-name {
      font-size: 26px;
      max-width: 330px;
    }
    .grid-name {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      max-width: 270px;
    }
    .extra-lineup {
      display: flex;
      gap: 16px;
      z-index: 1;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }
    .extra-name {
      font-size: 16px;
      font-weight: 600;
      color: #9999aa;
      padding: 2px 12px;
      border-left: 2px solid #ff4d6a;
    }
    .week-range {
      font-size: 25px;
      font-weight: 500;
      color: #9999aa;
      z-index: 1;
    }
    .brand {
      position: absolute;
      bottom: 34px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #666677;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-accent bg-accent-1"></div>
  <div class="bg-accent bg-accent-2"></div>
  <div class="header-label">This Week In</div>
  <div class="title">Houston Comedy</div>
  <div class="headshot-grid cols-3">
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/415/040df804-f51a-4e21-8137-d17f51f0e415_SOURCE" alt="Dan Howell">
        <div class="grid-name">Dan Howell</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/415/040df804-f51a-4e21-8137-d17f51f0e415_SOURCE" alt="Phil Lester">
        <div class="grid-name">Phil Lester</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/97b/cfee6cdb-a7a9-4a81-9823-963cf9f9f97b_TABLET_LANDSCAPE_LARGE_16_9.jpg" alt="Arin Hanson">
        <div class="grid-name">Arin Hanson</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/97b/cfee6cdb-a7a9-4a81-9823-963cf9f9f97b_TABLET_LANDSCAPE_LARGE_16_9.jpg" alt="Dan Avidan">
        <div class="grid-name">Dan Avidan</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/97b/cfee6cdb-a7a9-4a81-9823-963cf9f9f97b_TABLET_LANDSCAPE_LARGE_16_9.jpg" alt="Brian Wecht">
        <div class="grid-name">Brian Wecht</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/d35/942690b6-50b2-4028-9530-65dbd2e40d35_SOURCE" alt="Martin Amini">
        <div class="grid-name">Martin Amini</div>
      </div>
  </div>
  <div class="extra-lineup">
      <span class="extra-name">Justin Whitehead</span>
      <span class="extra-name">Chelby Morgan</span>
  </div>
  <div class="week-range">September 21 – September 27, 2026</div>
  <div class="brand">COMEDYHOUSTON.COM</div>
</body>
</html>
