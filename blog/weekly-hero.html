<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .bg-accent {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
    }
    .bg-accent-1 { background: #ff4d6a; top: -100px; right: -50px; }
    .bg-accent-2 { background: #7c5cff; bottom: -100px; left: -50px; }
    .header-label {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ff4d6a;
      margin-bottom: 12px;
      z-index: 1;
    }
    .title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 32px;
      z-index: 1;
      text-align: center;
    }
    .lineup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 1;
      margin-bottom: 32px;
    }
    .lineup-name {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      padding: 4px 20px;
      border-left: 3px solid #ff4d6a;
    }
    .week-range {
      font-size: 18px;
      font-weight: 500;
      color: #9999aa;
      z-index: 1;
    }
    .brand {
      position: absolute;
      bottom: 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #666677;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-accent bg-accent-1"></div>
  <div class="bg-accent bg-accent-2"></div>
  <div class="header-label">This Week In</div>
  <div class="title">Houston Comedy</div>
  <div class="lineup">
      <div class="lineup-name">Ali Siddiq</div>
      <div class="lineup-name">Greg Fitzsimmons</div>
      <div class="lineup-name">Sugar Sammy</div>
      <div class="lineup-name">Mae Martin</div>
      <div class="lineup-name">Henry Cho</div>
  </div>
  <div class="week-range">February 23 – March 1, 2026</div>
  <div class="brand">COMEDYHOUSTON.COM</div>
</body>
</html>
