<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .bg-accent {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
    }
    .bg-accent-1 { background: #ff4d6a; top: -150px; right: -100px; }
    .bg-accent-2 { background: #7c5cff; bottom: -150px; left: -100px; }
    .header-label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #ff4d6a;
      margin-bottom: 8px;
      z-index: 1;
    }
    .title {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 36px;
      z-index: 1;
      text-align: center;
    }
    .headshot-grid {
      display: grid;
      gap: 32px 48px;
      z-index: 1;
      margin-bottom: 28px;
      justify-items: center;
    }
    .headshot-grid.cols-1 { grid-template-columns: 1fr; max-width: 360px; }
    .headshot-grid.cols-2 { grid-template-columns: repeat(2, 1fr); max-width: 640px; }
    .headshot-grid.cols-3 { grid-template-columns: repeat(3, 1fr); max-width: 720px; gap: 24px 40px; }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .grid-item img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 77, 106, 0.5);
    }
    /* When fewer comedians are featured, give each one more visual weight. */
    .headshot-grid.cols-2 .grid-item img,
    .headshot-grid.cols-1 .grid-item img {
      width: 260px;
      height: 260px;
      border-width: 4px;
    }
    .headshot-grid.cols-2 .grid-name,
    .headshot-grid.cols-1 .grid-name {
      font-size: 22px;
      max-width: 260px;
    }
    .grid-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      max-width: 180px;
    }
    .extra-lineup {
      display: flex;
      gap: 16px;
      z-index: 1;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }
    .extra-name {
      font-size: 16px;
      font-weight: 600;
      color: #9999aa;
      padding: 2px 12px;
      border-left: 2px solid #ff4d6a;
    }
    .week-range {
      font-size: 20px;
      font-weight: 500;
      color: #9999aa;
      z-index: 1;
    }
    .brand {
      position: absolute;
      bottom: 28px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #666677;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-accent bg-accent-1"></div>
  <div class="bg-accent bg-accent-2"></div>
  <div class="header-label">This Week In</div>
  <div class="title">Houston Comedy</div>
  <div class="headshot-grid cols-3">
      <div class="grid-item">
        <img src="https://images.squarespace-cdn.com/content/v1/54fa08e2e4b04dc2c5e011a9/1628728282291-2T5OB8B3P055J5OELGAF/DJ+Demers+headshot+smallest.jpg" alt="DJ Demers">
        <div class="grid-name">DJ Demers</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/00a/9bc54acf-d39f-4641-b15b-f7d85b6fe00a_SOURCE" alt="Francis Ellis">
        <div class="grid-name">Francis Ellis</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/949/5cde611c-539d-443f-b0c7-bc13bcb06949_SOURCE" alt="Trey Kennedy">
        <div class="grid-name">Trey Kennedy</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/437/8aa1d8dd-f64c-42f3-aef1-0c05c60f7437_SOURCE" alt="Dave Attell">
        <div class="grid-name">Dave Attell</div>
      </div>
      <div class="grid-item">
        <img src="https://images.squarespace-cdn.com/content/v1/6903dde3b277a554a3099fce/8497a055-8291-4028-829f-f5f3c6a04bf7/net-positive-with-john-crist-podcast.png" alt="John Crist">
        <div class="grid-name">John Crist</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/c58/6d9532a3-bc6c-44d8-a617-a2f35614cc58_SOURCE" alt="Pedro Gonzalez">
        <div class="grid-name">Pedro Gonzalez</div>
      </div>
  </div>
  <div class="extra-lineup">
      <span class="extra-name">Tom Rhodes</span>
      <span class="extra-name">Zakir Khan</span>
  </div>
  <div class="week-range">April 13 – April 19, 2026</div>
  <div class="brand">COMEDYHOUSTON.COM</div>
</body>
</html>
