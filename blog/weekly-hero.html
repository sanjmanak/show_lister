<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .bg-accent {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
    }
    .bg-accent-1 { background: #ff4d6a; top: -150px; right: -100px; }
    .bg-accent-2 { background: #7c5cff; bottom: -150px; left: -100px; }
    .header-label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #ff4d6a;
      margin-bottom: 8px;
      z-index: 1;
    }
    .title {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 36px;
      z-index: 1;
      text-align: center;
    }
    .headshot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px 40px;
      z-index: 1;
      margin-bottom: 28px;
      max-width: 720px;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .grid-item img {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 77, 106, 0.5);
    }
    .grid-name {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      max-width: 180px;
    }
    .extra-lineup {
      display: flex;
      gap: 16px;
      z-index: 1;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }
    .extra-name {
      font-size: 16px;
      font-weight: 600;
      color: #9999aa;
      padding: 2px 12px;
      border-left: 2px solid #ff4d6a;
    }
    .week-range {
      font-size: 20px;
      font-weight: 500;
      color: #9999aa;
      z-index: 1;
    }
    .brand {
      position: absolute;
      bottom: 28px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #666677;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-accent bg-accent-1"></div>
  <div class="bg-accent bg-accent-2"></div>
  <div class="header-label">This Week In</div>
  <div class="title">Houston Comedy</div>
  <div class="headshot-grid">
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1167532203%2F3558237521%2F1%2Foriginal.20251031-183548?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=d35a6f7f17f9623e903e8239e8e7da9d" alt="Mo Amer">
        <div class="grid-name">Mo Amer</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/f43/27b58b09-11fa-4121-8b63-c49d2a6adf43_SOURCE" alt="Bill Burr">
        <div class="grid-name">Bill Burr</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/1ca/0b88ab90-df4a-4124-833d-ac5f37b181ca_SOURCE" alt="Dean Delray">
        <div class="grid-name">Dean Delray</div>
      </div>
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1177861371%2F2094665311053%2F1%2Foriginal.20260218-190437?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=4342660806c9e722a549ec54595cdd37" alt="Rachel Williams">
        <div class="grid-name">Rachel Williams</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/ecc/1f63601f-dd30-4e5d-a768-23b083249ecc_SOURCE" alt="Katt Williams">
        <div class="grid-name">Katt Williams</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/76c/8bddbe4c-93df-47bb-bbbd-fa495c8c676c_SOURCE" alt="Gianmarco Soresi">
        <div class="grid-name">Gianmarco Soresi</div>
      </div>
  </div>
  <div class="extra-lineup">
      <span class="extra-name">Michelle Buteau</span>
  </div>
  <div class="week-range">March 9 – March 15, 2026</div>
  <div class="brand">COMEDYHOUSTON.COM</div>
</body>
</html>
