<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
      color: #f0f0f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }
    .bg-accent {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
    }
    .bg-accent-1 { background: #ff4d6a; top: -150px; right: -100px; }
    .bg-accent-2 { background: #7c5cff; bottom: -150px; left: -100px; }
    .header-label {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #ff4d6a;
      margin-bottom: 10px;
      z-index: 1;
    }
    .title {
      font-size: 62px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 46px;
      z-index: 1;
      text-align: center;
    }
    /* The headshots are the content — size them up so they fill the 1080×1080
       frame instead of floating in dead space (matches the "pinch to zoom"
       crop an operator would otherwise do by hand before posting). */
    .headshot-grid {
      display: grid;
      gap: 34px 54px;
      z-index: 1;
      margin-bottom: 38px;
      justify-items: center;
    }
    .headshot-grid.cols-1 { grid-template-columns: 1fr; max-width: 420px; }
    .headshot-grid.cols-2 { grid-template-columns: repeat(2, 1fr); max-width: 720px; }
    .headshot-grid.cols-3 { grid-template-columns: repeat(3, 1fr); max-width: 920px; gap: 34px 54px; }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .grid-item img {
      width: 270px;
      height: 270px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 77, 106, 0.5);
    }
    /* When fewer comedians are featured, give each one even more visual weight. */
    .headshot-grid.cols-2 .grid-item img,
    .headshot-grid.cols-1 .grid-item img {
      width: 330px;
      height: 330px;
      border-width: 5px;
    }
    .headshot-grid.cols-2 .grid-name,
    .headshot-grid.cols-1 .grid-name {
      font-size: 26px;
      max-width: 330px;
    }
    .grid-name {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      max-width: 270px;
    }
    .extra-lineup {
      display: flex;
      gap: 16px;
      z-index: 1;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }
    .extra-name {
      font-size: 16px;
      font-weight: 600;
      color: #9999aa;
      padding: 2px 12px;
      border-left: 2px solid #ff4d6a;
    }
    .week-range {
      font-size: 25px;
      font-weight: 500;
      color: #9999aa;
      z-index: 1;
    }
    .brand {
      position: absolute;
      bottom: 34px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #666677;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-accent bg-accent-1"></div>
  <div class="bg-accent bg-accent-2"></div>
  <div class="header-label">This Week In</div>
  <div class="title">Houston Comedy</div>
  <div class="headshot-grid cols-3">
      <div class="grid-item">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Jay_Pharoah_by_Gage_Skidmore.jpg/960px-Jay_Pharoah_by_Gage_Skidmore.jpg?utm_source=en.wikipedia.org&amp;amp;utm_campaign=index&amp;amp;utm_content=thumbnail" alt="Jay Pharoah">
        <div class="grid-name">Jay Pharoah</div>
      </div>
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1189098135%2F2991795842957%2F1%2Foriginal.20260717-205824?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=a8b150d0dbbd30e6aa667b2fcaa075da" alt="Lisandra Vazquez live at the Den…">
        <div class="grid-name">Lisandra Vazquez live at the Den…</div>
      </div>
      <div class="grid-item">
        <img src="https://s1.ticketm.net/dam/a/035/28a67745-87b5-4756-a998-95cef093a035_SOURCE" alt="Sydney Castillo">
        <div class="grid-name">Sydney Castillo</div>
      </div>
      <div class="grid-item">
        <img src="https://dont-tell-comedy.mo.cloudinary.net/private/arttheater_opie_QeRoGEy.webp" alt="Don't Tell Comedy">
        <div class="grid-name">Don't Tell Comedy</div>
      </div>
      <div class="grid-item">
        <img src="https://img.evbuc.com/https%3A%2F%2Fcdn.evbuc.com%2Fimages%2F1190849823%2F2996872667695%2F1%2Foriginal.20260811-234405?auto=format%2Ccompress&amp;q=75&amp;sharp=10&amp;s=d57981ecff808e05885b49b8202e8b52" alt="Friday Night Comedy at The Pink F…">
        <div class="grid-name">Friday Night Comedy at The Pink F…</div>
      </div>
      <div class="grid-item">
        <img src="https://www.riotconroe.com/img/events/Guadalaharrys-54-eaf10ba5-large-thumb.png" alt="Comedian Chris Munch Live in Conroe">
        <div class="grid-name">Comedian Chris Munch Live in Conroe</div>
      </div>
  </div>

  <div class="week-range">August 24 – August 30, 2026</div>
  <div class="brand">COMEDYHOUSTON.COM</div>
</body>
</html>
