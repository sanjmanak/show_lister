name: Delete Old Comedian Posts

on:
  # Daily at 13:00 UTC (8 AM CT) — sits between post-to-instagram's 10:00
  # and 16:00 UTC slots so the shared concurrency group never has to queue
  # a posting run behind this one.
  schedule:
    - cron: '31 13 * * *'  # off :00; still between the IG slots

  # Manual trigger — dry_run logs what would be deleted without touching
  # anything (recommended for the first run after a change).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log deletions without executing them'
        type: boolean
        default: false
      retention_days:
        description: 'Delete spotlights older than this many days'
        type: string
        default: '5'

permissions:
  contents: write

# SAME group as post-to-instagram.yml — serializes the two workflows' writes
# to blog/comedians/ig-post-state.json and their pushes to main.
concurrency:
  group: post-to-instagram
  cancel-in-progress: false

env:
  TZ: America/Chicago

jobs:
  delete-old-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install — the cleanup script is zero-dependency (unlike the
      # posters, there is no Puppeteer image generation here).
      - name: Delete aged comedian spotlights
        timeout-minutes: 10
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          COMEDIAN_RETENTION_DAYS: ${{ inputs.retention_days || '5' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node scripts/delete-comedian-posts.js

      # Blog-post reaper: once a spotlight week's last show date has passed
      # (plus a 1-day grace), delete the WordPress posts themselves and
      # archive that week's manifest. Indexable spotlights must not pile up
      # as stale thin content — see scripts/delete-comedian-blog-posts.js.
      - name: Delete finished-week spotlight blog posts
        timeout-minutes: 10
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node scripts/delete-comedian-blog-posts.js

      - name: Commit cleanup state
        # always() so partial progress (some IDs deleted before a failure)
        # still lands — the script writes state before choosing its exit
        # code. Dry runs leave no diff, so this no-ops naturally.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/comedians/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Comedian spotlight cleanup — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            pushed=false
            for i in 1 2 3 4; do
              echo "Push attempt $i…"
              # Abort a half-applied rebase so the next attempt starts clean.
              git pull --rebase origin main --no-edit || { git rebase --abort 2>/dev/null || true; }
              if git push origin main; then
                echo "Push succeeded on attempt $i."
                pushed=true
                break
              fi
              echo "Push failed, retrying in ${i}s…"
              sleep $i
            done
            # Without this the loop falls through on total failure and the
            # step exits 0 via the final `sleep` — a silently lost push.
            if [ "$pushed" != "true" ]; then
              echo "ERROR: git push failed after 4 attempts."
              exit 1
            fi
          fi

  # Failure notifier lives in its own job so a broken notifier can never
  # block the cleanup — same pattern as delete-old-tonight-posts.yml.
  notify-failure:
    needs: delete-old-posts
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure (SMTP via curl)
        if: env.HAS_SMTP == 'true'
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER != '' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "From: ${SMTP_FROM}"
            echo "To: ${NOTIFY_EMAIL}"
            echo "Subject: [Comedy Houston] Comedian-spotlight CLEANUP failed"
            echo "Content-Type: text/plain; charset=UTF-8"
            echo
            echo "The comedian spotlight cleanup workflow failed — aged posts"
            echo "may still be live on Instagram/Facebook. Failed IDs stay in"
            echo "the state file and tomorrow's run retries automatically."
            echo "Check the logs:"
            echo
            echo "Run: ${RUN_URL}"
          } > "${RUNNER_TEMP}/comedian-cleanup-failure-email.txt"

          if [ "${SMTP_PORT}" = "465" ]; then
            URL="smtps://${SMTP_SERVER}:${SMTP_PORT}"
          else
            URL="smtp://${SMTP_SERVER}:${SMTP_PORT}"
          fi

          curl --silent --show-error --fail --ssl-reqd \
            --url "${URL}" \
            --user "${SMTP_USERNAME}:${SMTP_PASSWORD}" \
            --mail-from "${SMTP_FROM}" \
            --mail-rcpt "${NOTIFY_EMAIL}" \
            --upload-file "${RUNNER_TEMP}/comedian-cleanup-failure-email.txt"
          echo "Failure notification email sent."
