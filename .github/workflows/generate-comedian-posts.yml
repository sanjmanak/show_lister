name: Generate Comedian Blog Posts

on:
  # Run weekly — Monday at 10am Central (1 hour after the weekly blog post)
  # 10am CDT = 15:00 UTC, 10am CST = 16:00 UTC
  # Using 16:00 UTC to cover both
  schedule:
    - cron: '0 16 * * 1'   # Every Monday ~10am CT

  # Manual trigger from the Actions tab. lead_weeks lets a backfill run
  # target a nearer week during the 3-week-lead transition (0 = this week).
  workflow_dispatch:
    inputs:
      lead_weeks:
        description: 'Weeks ahead of the current week to generate for'
        type: string
        default: '3'

permissions:
  contents: write

# Prevent manual reruns from racing the Mon cron — both publish to WordPress
# and both commit to blog/comedians/. Slug-dedup keeps WP safe; this keeps git
# clean.
concurrency:
  group: generate-comedian-posts
  cancel-in-progress: false

env:
  TZ: America/Chicago
  # Cron runs use the 3-week lead; manual runs can override via input.
  LEAD_WEEKS: ${{ inputs.lead_weeks || '3' }}

jobs:
  generate-comedian-posts:
    runs-on: ubuntu-latest
    # Typical run is 3–8 min; cap at 45 to allow for ~6 comedians × 3 OpenAI
    # calls + Puppeteer screenshots without leaving a hung process running for
    # hours.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate per-comedian blog posts + graphics + captions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/generate-comedian-post.js

      - name: Install Puppeteer
        run: npm install puppeteer --no-save

      - name: Screenshot comedian Instagram graphics
        run: node scripts/screenshot-comedian-graphics.js

      - name: Screenshot blog post teasers (for Instagram carousels)
        run: node scripts/screenshot-blog-teasers.js

      - name: Commit and push comedian posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/comedians/
          # The script writes sitemap.xml to the repo root; without staging it
          # here it was generated every Monday and thrown away with the runner.
          # (if-form, not `[ ] &&` — a missing file must not trip `bash -e`.)
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No new comedian posts to commit."
          else
            git commit -m "Comedian spotlights — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            # Rebase-then-retry, same pattern as the other workflows. Stash any
            # remaining TRACKED modifications so the rebase can run — but not
            # --include-untracked, which pointlessly stashed node_modules.
            git stash || true
            pushed=false
            for i in 1 2 3 4; do
              echo "Push attempt $i…"
              git pull --rebase origin main --no-edit || { git rebase --abort 2>/dev/null || true; }
              if git push origin main; then
                echo "Push succeeded on attempt $i."
                pushed=true
                break
              fi
              echo "Push failed, retrying in ${i}s…"
              sleep $i
            done
            git stash pop 2>/dev/null || true
            if [ "$pushed" != "true" ]; then
              echo "ERROR: git push failed after 4 attempts — the IG poster will have nothing to post."
              exit 1
            fi
          fi

      - name: Check if email is configured
        id: email-check
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER }}
        run: |
          if [ -n "$HAS_SMTP" ] && [ -f blog/comedians/email-subject.txt ] && [ -f blog/comedians/email-body.txt ]; then
            echo "send_email=true" >> $GITHUB_OUTPUT
          else
            echo "send_email=false" >> $GITHUB_OUTPUT
            echo "Skipping email — SMTP not configured or email files missing."
          fi

      - name: Load email content
        if: steps.email-check.outputs.send_email == 'true'
        run: |
          # Collapse the subject to a single line before writing KEY=VALUE:
          # the subject embeds feed-derived comedian names, and a smuggled
          # newline would let a second KEY=VALUE line into $GITHUB_ENV (the
          # same injection the heredoc below defends the body against).
          echo "EMAIL_SUBJECT=$(tr -d '\r\n' < blog/comedians/email-subject.txt)" >> $GITHUB_ENV
          # Random delimiter so an LLM-written body line can never terminate
          # the heredoc early and smuggle env vars into later steps.
          delim="EMAIL_BODY_EOF_${RANDOM}${RANDOM}"
          echo "EMAIL_BODY<<${delim}" >> $GITHUB_ENV
          cat blog/comedians/email-body.txt >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "${delim}" >> $GITHUB_ENV

      - name: Collect PNG attachments list
        if: steps.email-check.outputs.send_email == 'true'
        id: attachments
        run: |
          # Build comma-separated list of all PNG files in images dir
          PNGS=$(find blog/comedians/images -name '*.png' 2>/dev/null | sort | tr '\n' ',')
          # Remove trailing comma
          PNGS="${PNGS%,}"
          echo "files=${PNGS}" >> $GITHUB_OUTPUT
          echo "Found attachments: ${PNGS}"

      - name: Email comedian spotlight assets
        if: steps.email-check.outputs.send_email == 'true' && steps.attachments.outputs.files != ''
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3 (SHA-pinned: action receives SMTP secrets)
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ env.EMAIL_SUBJECT }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: ${{ env.EMAIL_BODY }}
          attachments: ${{ steps.attachments.outputs.files }}

      - name: Notify on failure
        if: failure() && env.HAS_SMTP == 'true'
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER != '' }}
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3 (SHA-pinned: action receives SMTP secrets)
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Comedy Houston] generate-comedian-posts FAILED"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            The generate-comedian-posts workflow failed.
            Per-comedian posts may be missing for this week — the IG poster
            will have nothing new to publish until this is fixed.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
