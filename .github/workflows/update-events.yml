name: Update Comedy Events

on:
  # Run twice daily at 8am and 6pm Central Time
  # Central Time is UTC-6 (CST) or UTC-5 (CDT)
  # 8am CT = 14:00 UTC (CST) / 13:00 UTC (CDT)
  # 6pm CT = 00:00 UTC next day (CST) / 23:00 UTC (CDT)
  # Using CDT (March-November) times — GitHub will run at these UTC times year-round
  schedule:
    - cron: '0 14 * * *'   # ~8am CT
    - cron: '0 0 * * *'    # ~6pm CT

  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scheduled/manual runs from racing on events.json + index.html.
concurrency:
  group: update-events
  cancel-in-progress: false

env:
  TZ: America/Chicago

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    # Fetch normally takes <30s; cap at 15 min so a hung HTTPS socket can never
    # burn the default 6h job timeout.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch events from APIs
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: node scripts/fetch-events.js

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json index.html
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update events data — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            # Integrate remote changes before pushing. A bare `git push` here
            # loses the race whenever another workflow (or a re-run replaying an
            # older commit SHA) leaves main ahead of this job's checkout, which
            # is exactly how this workflow's own push beat the blog run and got
            # it rejected. Rebase-then-retry matches the other push steps.
            for i in 1 2 3 4; do
              echo "Push attempt $i…"
              git pull --rebase origin main --no-edit || true
              if git push origin main; then
                echo "Push succeeded on attempt $i."
                break
              fi
              echo "Push failed, retrying in ${i}s…"
              sleep $i
            done
          fi

      - name: Notify on failure
        if: failure() && env.HAS_SMTP == 'true'
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Comedy Houston] update-events FAILED"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            The update-events workflow failed.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
