name: Update Comedy Events

on:
  # Run twice daily. GitHub cron is UTC year-round, so Central times shift
  # with DST: 14:00 UTC = 8am CST / 9am CDT; 00:00 UTC = 6pm CST / 7pm CDT.
  # (Most of the year Houston is on CDT, so in practice ~9am and ~7pm.)
  schedule:
    - cron: '0 14 * * *'   # ~8am CT
    - cron: '0 0 * * *'    # ~6pm CT

  # Manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scheduled/manual runs from racing on events.json + index.html.
concurrency:
  group: update-events
  cancel-in-progress: false

env:
  TZ: America/Chicago

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    # The API fetches take <30s, but the StandupTix harvest honors the
    # platform's robots.txt Crawl-Delay of 3s per event page (~70 pages ≈
    # 3.5–4 min per venue in config/standuptix-venues.json). Cap at 25 min so
    # a hung HTTPS socket still can't burn the default 6h job timeout.
    # Cold-cache worst case: ~330 Riot pages x 3s Crawl-Delay ≈ 17 min of
    # sleeping plus API fetches. Warm-cache runs (the normal case since the
    # standuptix-cache.json lastmod cache) finish in a few minutes.
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ticketmaster + Eventbrite via their APIs, plus StandupTix venue sites
      # (config/standuptix-venues.json) via sitemap + JSON-LD harvest — no
      # secret needed for that source.
      - name: Fetch events from APIs
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          # Show-tag classification of new show names (fail-open: the import
          # runs fine without it, new shows just stay untagged that run).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/fetch-events.js

      - name: Detect just-announced shows
        run: node scripts/just-announced.js

      - name: Price coverage summary
        run: |
          node -e "
            const d = require('./events.json');
            for (const s of ['ticketmaster', 'eventbrite', 'standuptix', 'donttellcomedy']) {
              const g = d.events.filter(e => e.source === s);
              const missing = g.filter(e => e.price_min == null).length;
              console.log(s + ': ' + g.length + ' events, ' + missing + ' without price');
            }
            const page = d.events.filter(e => e.price_source === 'page').length;
            console.log('page-sourced prices (incl. fees): ' + page);
          "

      # Only the scheduled/dispatched runs on main may publish. This also
      # makes a workflow_dispatch on a feature branch a safe dry run: it
      # fetches and prints the summary but never pushes.
      - name: Commit and push updated data
        id: push-data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json index.html excluded-events.json config/price-cache.json \
                  config/show-tags-cache.json config/standuptix-cache.json \
                  config/announced-seen.json config/just-announced.json
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update events data — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            # Integrate remote changes before pushing. A bare `git push` here
            # loses the race whenever another workflow (or a re-run replaying an
            # older commit SHA) leaves main ahead of this job's checkout, which
            # is exactly how this workflow's own push beat the blog run and got
            # it rejected. Rebase-then-retry matches the other push steps.
            pushed=false
            for i in 1 2 3 4; do
              echo "Push attempt $i…"
              # Abort a half-applied rebase so the next attempt starts clean.
              git pull --rebase origin main --no-edit || { git rebase --abort 2>/dev/null || true; }
              if git push origin main; then
                echo "Push succeeded on attempt $i."
                pushed=true
                break
              fi
              echo "Push failed, retrying in ${i}s…"
              sleep $i
            done
            # Without this the loop falls through on total failure and the
            # step exits 0 via the final `sleep` — a silently lost push.
            if [ "$pushed" != "true" ]; then
              echo "ERROR: git push failed after 4 attempts."
              exit 1
            fi
            echo "did_push=true" >> "$GITHUB_OUTPUT"
            echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Tell WordPress the data changed so it purges the LiteSpeed page cache
      # for the homepage and every listing page. Without this, fully cached
      # pages never run PHP, the plugin's events transient never refreshes,
      # and the homepage keeps advertising Monday's shows as "Tonight" for
      # days (the plugin also runs an hourly hash-check cron as a fallback,
      # so a failure here degrades to ≤1h extra staleness, not brokenness).
      # The pushed commit SHA is passed so the plugin fetches the immutable
      # raw URL — the branch URL is CDN-cached for ~5 minutes and could hand
      # back the previous payload. Best-effort: a purge failure should not
      # fail the data run.
      - name: Purge WordPress listing cache
        if: steps.push-data.outputs.did_push == 'true' && env.HAS_WP == 'true'
        env:
          HAS_WP: ${{ secrets.WP_SITE_URL != '' }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          SHA="${{ steps.push-data.outputs.pushed_sha }}"
          if curl -sS --fail-with-body --max-time 30 -X POST \
               -u "$WP_APP_USER:$WP_APP_PASSWORD" \
               -H 'Content-Type: application/json' \
               -d "{\"sha\":\"$SHA\"}" \
               "${WP_SITE_URL%/}/wp-json/comedy-houston/v1/refresh"; then
            echo ""
            echo "Cache purge OK."
          else
            echo "::warning::WordPress cache purge failed — hourly cron fallback will purge within the hour."
          fi

      - name: Notify on failure
        if: failure() && env.HAS_SMTP == 'true'
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER != '' }}
        # Pinned to the v3 commit SHA: this action receives the SMTP
        # credentials, and a mutable tag could be repointed at malicious code.
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Comedy Houston] update-events FAILED"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            The update-events workflow failed.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
