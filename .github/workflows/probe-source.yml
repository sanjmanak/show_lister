# TEMPORARY — source-feasibility probe. Fetches candidate event sources from
# the Actions runner (open network) and prints their structure to the log,
# because the authoring environment's egress proxy can't reach them. Read-only,
# no secrets, no writes. Delete this file and scripts/probe-source.js once the
# probe results have been read.
name: Probe Event Source (temporary)

on:
  push:
    branches:
      - claude/standuptix-event-adapter-ha8jmi

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe-source.js
