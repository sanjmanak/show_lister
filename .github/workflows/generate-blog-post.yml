name: Generate Weekly Blog Post

on:
  # Run once a week — Monday at 9am Central Time
  # CT is UTC-6 (CST) or UTC-5 (CDT)
  # 9am CDT = 14:00 UTC, 9am CST = 15:00 UTC
  # Using 15:00 UTC to cover both (runs at 9am CST / 10am CDT)
  schedule:
    - cron: '0 15 * * 1'   # Every Monday ~9am CT

  # Manual trigger from the Actions tab (great for testing!)
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/Chicago

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog post from events
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-blog-post.js

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Screenshot hero creative
        run: node scripts/screenshot-hero.js

      - name: Commit and push blog post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/index.html blog/weekly-hero.html blog/weekly-hero.png
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly blog post — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            git push
          fi
