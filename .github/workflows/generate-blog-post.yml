name: Generate Weekly Blog Post

on:
  # Monday: full blog generation + WordPress weekly roundup publish.
  #
  # The Thursday cron is gone. Its only job was refreshing the
  # /houston-comedy-shows-this-weekend/ blog post, which is retired — that
  # post duplicated the evergreen /this-weekend/ page and now 301s to it.
  # Left in place the Thursday run would have spent OpenAI calls and CI
  # minutes every week building copy for a URL nobody can reach.
  #
  # CT is UTC-6 (CST) or UTC-5 (CDT)
  # 9am CDT = 14:00 UTC, 9am CST = 15:00 UTC
  # Using 15:00 UTC to cover both (runs at 9am CST / 10am CDT)
  schedule:
    - cron: '0 15 * * 1'   # Every Monday ~9am CT (full run)

  # Manual trigger from the Actions tab (great for testing!)
  workflow_dispatch:

permissions:
  contents: write

# Prevent a manual run from racing the Monday cron — both call WordPress and
# both push to main. f6dabb1's slug-dedup keeps WP safe; this keeps git safe.
concurrency:
  group: generate-blog-post
  cancel-in-progress: false

env:
  TZ: America/Chicago

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    # Hard ceiling for the whole job. The script itself enforces tighter
    # per-call timeouts (WP_REQUEST_TIMEOUT_MS / WP_UPLOAD_TIMEOUT_MS /
    # WP_TOTAL_BUDGET_MS) so any individual hang aborts cleanly and the
    # email step still runs. This 20-minute cap is the absolute fail-safe
    # for runaway OpenAI / Puppeteer calls.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Puppeteer must be installed BEFORE generate-blog-post.js runs because
      # that script renders the weekly hero PNG inline (so the WordPress
      # weekly-roundup publish gets *this* week's image, not last week's).
      - name: Install Puppeteer
        run: npm install puppeteer --no-save

      - name: Generate blog post from events
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node scripts/generate-blog-post.js

      # `if: !cancelled()` on the next four steps means: even if the
      # generate step exited non-zero (e.g. WordPress publishing blew up),
      # we still commit the partial output, send the Instagram email, and
      # run the failure notifier. The script's WP timeouts mean a hang
      # becomes a thrown error rather than a job-killing 30-minute wait,
      # so by the time we get here we usually still have a hero PNG and a
      # caption on disk that the operator can post manually.
      - name: Commit and push blog post
        id: commit-blog
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage all blog files that exist.
          # top-comedians.json is the handoff file consumed by generate-comedian-post.js;
          # if it's not committed, the comedian workflow can't reuse the strict-gated
          # displayImage and re-runs identifyTopComedians() unnecessarily.
          for f in blog/index.html blog/weekly-hero.html blog/weekly-hero.png blog/instagram-caption.txt blog/top-comedians.json blog/weekly-meta.json; do
            [ -f "$f" ] && git add "$f"
          done
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly blog post — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            # Integrate any commits that landed on main since this job's
            # checkout BEFORE pushing. Two ways this bites otherwise:
            #   1. Live race — another workflow (update-events, post-to-
            #      instagram, …) pushes during the ~1.5min generate window.
            #   2. Re-runs — GitHub replays the run against its ORIGINAL commit
            #      SHA, so a re-run's checkout is behind today's main and a bare
            #      push is rejected "fetch first" every time, deterministically.
            # A bare `git push` handled neither; rebase-then-retry (the same
            # pattern the other push steps/workflows use) handles both.
            pushed=false
            for i in 1 2 3 4; do
              echo "Push attempt $i…"
              # Abort a half-applied rebase so the next attempt starts clean.
              # A dirty tracked file (e.g. package.json from a stray npm
              # install) makes `pull --rebase` refuse and killed all 4
              # retries on 2026-08-17. Only committed work matters here —
              # drop any incidental tracked-file dirt before rebasing.
              git checkout -- package.json 2>/dev/null || true
              git pull --rebase origin main --no-edit || { git rebase --abort 2>/dev/null || true; }
              if git push origin main; then
                echo "Push succeeded on attempt $i."
                pushed=true
                break
              fi
              echo "Push failed, retrying in ${i}s…"
              sleep $i
            done
            # Without this the loop falls through on total failure and the
            # step exits 0 via the final `sleep` — a silently lost push.
            if [ "$pushed" != "true" ]; then
              echo "ERROR: git push failed after 4 attempts."
              exit 1
            fi
          fi

      # Auto-post the weekly roundup (hero + caption) to IG + FB. Runs AFTER
      # the commit/push so the hero PNG is reachable on main. The script
      # refuses stale creative (weekly-meta.json week check) and can't
      # double-post (weekly-post-state.json), so `!cancelled()` is safe even
      # when the generate step exited non-zero after writing the creative.
      # Gated on the commit step SUCCEEDING (not just !cancelled()) — if the
      # push failed, main still serves LAST week's hero PNG and Meta would
      # fetch and post it under this week's caption.
      - name: Auto-post weekly roundup to Instagram + Facebook
        id: autopost
        if: ${{ !cancelled() && steps.commit-blog.outcome == 'success' }}
        timeout-minutes: 12
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_CHANNEL_TIMEOUT_MS: '180000'
        run: node scripts/post-weekly-roundup.js

      - name: Commit weekly posting state
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/weekly-post-state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Weekly roundup posted — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            pushed=false
            for i in 1 2 3 4; do
              echo "Push attempt $i…"
              # Abort a half-applied rebase so the next attempt starts clean.
              # A dirty tracked file (e.g. package.json from a stray npm
              # install) makes `pull --rebase` refuse and killed all 4
              # retries on 2026-08-17. Only committed work matters here —
              # drop any incidental tracked-file dirt before rebasing.
              git checkout -- package.json 2>/dev/null || true
              git pull --rebase origin main --no-edit || { git rebase --abort 2>/dev/null || true; }
              if git push origin main; then
                echo "Push succeeded on attempt $i."
                pushed=true
                break
              fi
              echo "Push failed, retrying in ${i}s…"
              sleep $i
            done
            # Without this the loop falls through on total failure and the
            # step exits 0 via the final `sleep` — a silently lost push.
            if [ "$pushed" != "true" ]; then
              echo "ERROR: git push failed after 4 attempts."
              exit 1
            fi
          fi

      - name: Check if email is configured
        if: ${{ !cancelled() }}
        id: email-check
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER }}
        run: |
          if [ -n "$HAS_SMTP" ] && [ -f blog/instagram-caption.txt ] && [ -f blog/weekly-hero.png ]; then
            echo "send_email=true" >> $GITHUB_OUTPUT
          else
            echo "send_email=false" >> $GITHUB_OUTPUT
            echo "Skipping email — SMTP not configured or files missing."
          fi

      - name: Load caption for email
        if: ${{ !cancelled() && steps.email-check.outputs.send_email == 'true' }}
        run: |
          # Random delimiter so a caption line can never terminate the heredoc
          # early and smuggle arbitrary env vars into later steps.
          delim="CAPTION_EOF_${RANDOM}${RANDOM}"
          echo "CAPTION<<${delim}" >> $GITHUB_ENV
          cat blog/instagram-caption.txt >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "${delim}" >> $GITHUB_ENV

      - name: Email weekly creative + caption
        # Only claims "auto-posted" when the auto-post step actually ran and
        # succeeded. On 2026-08-17 this email fired after the post was
        # SKIPPED (commit failed), asserting a post that never happened —
        # the not-posted variant below covers that case honestly.
        if: ${{ !cancelled() && steps.email-check.outputs.send_email == 'true' && steps.autopost.outcome == 'success' }}
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3 (SHA-pinned: action receives SMTP secrets)
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Comedy Houston — Weekly Creative (auto-posted)"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            This week's Comedy Houston creative. It was AUTO-POSTED to
            Instagram + Facebook by the workflow — this email is your
            receipt and backup. If the auto-post step failed (check the
            workflow run), post it manually with the caption below.

            -----------------------------------------------
            INSTAGRAM CAPTION (copy & paste if needed)
            -----------------------------------------------

            ${{ env.CAPTION }}

            -----------------------------------------------

            Blog post: https://sanjmanak.github.io/show_lister/blog/
          attachments: blog/weekly-hero.png

      - name: Email weekly creative — NOT posted, manual action needed
        if: ${{ !cancelled() && steps.email-check.outputs.send_email == 'true' && steps.autopost.outcome != 'success' }}
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3 (SHA-pinned: action receives SMTP secrets)
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Comedy Houston] Weekly creative NOT posted - post manually"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            This week's creative was generated but was NOT posted to
            Instagram or Facebook (auto-post step outcome:
            ${{ steps.autopost.outcome }}). Usually this means the git
            commit/push failed, and posting was skipped on purpose so the
            wrong week's image could not go out.

            Two options:

            1. Re-run the workflow from the Actions tab once the failure
               cause is fixed (it regenerates and auto-posts):
               https://github.com/${{ github.repository }}/actions/workflows/generate-blog-post.yml

            2. Or post manually right now: the hero image is attached and
               the caption is below.

            -----------------------------------------------
            INSTAGRAM CAPTION (copy & paste)
            -----------------------------------------------

            ${{ env.CAPTION }}

            -----------------------------------------------

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          attachments: blog/weekly-hero.png

      # WordPress publishing is best-effort. When it fails but Instagram/
      # Facebook posted fine, the script writes blog/wp-publish-status.json and
      # exits 0 — the run stays GREEN. We surface the WP failure with its own
      # alert email so the WordPress site doesn't silently go stale, without the
      # whole automation looking broken (which is what made run #51 look like
      # the IG post hadn't happened when it actually had).
      - name: Check if WordPress publish failed
        if: ${{ !cancelled() }}
        id: wp-check
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER }}
        run: |
          if [ -f blog/wp-publish-status.json ]; then
            echo "WordPress publish failures detected:"
            cat blog/wp-publish-status.json
            if [ -n "$HAS_SMTP" ]; then
              echo "wp_failed=true" >> $GITHUB_OUTPUT
              {
                echo "WP_FAILURES<<WP_EOF"
                cat blog/wp-publish-status.json
                echo ""
                echo "WP_EOF"
              } >> $GITHUB_ENV
            else
              echo "wp_failed=false" >> $GITHUB_OUTPUT
              echo "SMTP not configured — skipping WP alert email."
            fi
          else
            echo "wp_failed=false" >> $GITHUB_OUTPUT
            echo "WordPress published cleanly (no marker file)."
          fi

      - name: Alert on WordPress publish failure
        if: ${{ !cancelled() && steps.wp-check.outputs.wp_failed == 'true' }}
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3 (SHA-pinned: action receives SMTP secrets)
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Comedy Houston] WordPress publish failed — Instagram/Facebook are fine"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Heads up: this week's automation ran and your Instagram + Facebook
            post WENT OUT FINE. WordPress publishing is the only thing that
            failed, so the blog site may be showing last week's content.

            This run is still marked GREEN on purpose — the social post is the
            deliverable and it succeeded. This email exists only so the
            WordPress side doesn't quietly go stale.

            The script already retried automatically with backoff, and the next
            scheduled run will retry again. If you keep getting this email, the
            host (Hostinger) is likely blocking the WordPress REST API — check
            the site's WAF / security plugin and allowlist /wp-json/.

            What failed:
            ${{ env.WP_FAILURES }}

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify on failure
        if: failure() && env.HAS_SMTP == 'true'
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER != '' }}
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3 (SHA-pinned: action receives SMTP secrets)
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Comedy Houston] generate-blog-post FAILED"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            The generate-blog-post workflow failed.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
