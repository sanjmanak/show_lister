name: Post to Instagram

on:
  # Staggered schedule: every 6 hours starting Monday 4pm CT (22:00 UTC)
  # Mon 4pm CT, Mon 10pm CT, Tue 4am CT, Tue 10am CT, Tue 4pm CT, ...
  # 4pm CDT = 21:00 UTC, 4pm CST = 22:00 UTC — using 22:00 to cover both
  schedule:
    - cron: '23 4,10,16,22 * * *'  # Every 6 hours (minute 23: GitHub delays :00 crons)

  # Manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

# Critical: the 6-hour cron + manual_dispatch could otherwise double-fire and
# both runs would mutate ig-post-state.json + race to push main. Serialize.
concurrency:
  group: post-to-instagram
  cancel-in-progress: false

env:
  TZ: America/Chicago

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    # Hard cap so a hung node process can never burn unbounded CI time and —
    # more importantly — can never block the Commit state step from running
    # on the next scheduled run. Budget breakdown:
    #   4 channels × 3 min per-channel timeout (IG_CHANNEL_TIMEOUT_MS=180000)
    #   = 12 min worst case + setup/commit overhead → 25 min job cap.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check if manifest exists
        id: check
        run: |
          # Week-keyed manifests (manifest-YYYY-MM-DD.json) or the legacy
          # manifest.json both count; post-to-instagram.js resolves which
          # one actually covers the current week.
          if ls blog/comedians/manifest*.json >/dev/null 2>&1; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No manifest files found — skipping."
          fi

      - name: Set up Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Week-of creative: replace each current-week comedian's square/story
      # PNGs with live screenshots of their (by now hopefully ranking) blog
      # post. Runs once per comedian per week via .live-refreshed markers.
      # Must be committed and pushed BEFORE posting — Meta fetches the
      # images from GitHub Pages. Non-fatal throughout: a failed refresh
      # just means the pre-generated designed graphics get posted instead.
      # Two Puppeteer passes, both best-effort:
      #   1. ensure-comedian-graphics.js rebuilds any designed square /
      #      portrait / story PNG that is missing for the current week
      #      (self-heal: the 2026-09-07 failure was a 404 on a PNG that a
      #      cleanup step had deleted).
      #   2. refresh-live-creative.js screenshots each published post once,
      #      the week of the show, as the carousel's second slide.
      - name: Rebuild missing graphics + refresh live creative
        if: steps.check.outputs.skip != 'true'
        timeout-minutes: 12
        continue-on-error: true
        run: |
          npm install puppeteer --no-save
          node scripts/ensure-comedian-graphics.js
          node scripts/refresh-live-creative.js

      - name: Commit refreshed creative
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/comedians/images/
          if git diff --staged --quiet; then
            echo "No creative changes to commit."
          else
            git commit -m "Live spotlight creative — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            for i in 1 2 3 4; do
              git pull --rebase origin main --no-edit || { git rebase --abort 2>/dev/null || true; }
              if git push origin main; then break; fi
              sleep $i
            done
            # Give GitHub Pages a moment to deploy the new PNGs before the
            # poster hands Meta the URLs.
            sleep 90
          fi

      - name: Post next comedian to Instagram
        if: steps.check.outputs.skip != 'true'
        # Step-level cap: if the node process ever fails to exit cleanly,
        # kill it so the Commit state step still runs. Must be > sum of
        # per-channel timeouts (4 × 3 min = 12 min) plus headroom.
        timeout-minutes: 18
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          # Tighten per-channel timeout from default 5 min → 3 min so that
          # all four channels can finish within the step timeout above.
          IG_CHANNEL_TIMEOUT_MS: '180000'
        run: node scripts/post-to-instagram.js

      - name: Commit updated state file
        # always() so that even if the post step times out or errors after
        # saveState() has already written ig-post-state.json, we still
        # commit/push the advancement and avoid reposting the same comedian.
        if: always() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/comedians/ig-post-state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Instagram post — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            # Retry push up to 4 times (handles concurrent workflow runs)
            pushed=false
            for i in 1 2 3 4; do
              echo "Push attempt $i…"
              git pull --rebase origin main --no-edit 2>/dev/null || {
                echo "Rebase conflict — resetting and re-applying."
                git rebase --abort 2>/dev/null || true
                git reset --soft HEAD~1
                git stash
                git pull origin main
                git stash pop
                git add blog/comedians/ig-post-state.json
                git commit -m "Instagram post — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
              }
              if git push origin main; then
                echo "Push succeeded on attempt $i."
                pushed=true
                break
              fi
              echo "Push failed, retrying in ${i}s…"
              sleep $i
            done
            # A lost state push here means the same comedian gets reposted by
            # the next cron — fail loudly instead of exiting 0 via `sleep`.
            if [ "$pushed" != "true" ]; then
              echo "ERROR: git push failed after 4 attempts — ig-post-state.json was NOT saved."
              exit 1
            fi
          fi

  # Failure notification lives in its OWN job. GitHub downloads every action a
  # job references during "Set up job" — BEFORE any step runs — so a third-party
  # action that fails to download (e.g. a moved/unservable tag) aborts the whole
  # job at setup, even when it's only meant to run on failure. Keeping the email
  # action out of the posting job guarantees a broken notifier can never block
  # posting. This job only spins up when post-to-instagram fails.
  # Separate job so the email goes out even when the posting job's own
  # cleanup steps fail. Uses the same SHA-pinned mail action as every other
  # workflow: the previous hand-rolled curl SMTP call failed with "MAIL
  # failed: 555" the one time it was needed (2026-09-07), so the failure
  # alert itself never arrived.
  notify-failure:
    needs: post-to-instagram
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on failure
        if: env.HAS_SMTP == 'true'
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER != '' }}
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3 (SHA-pinned: action receives SMTP secrets)
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Comedy Houston] post-to-instagram FAILED"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            The post-to-instagram workflow failed. The state file may or may
            not have advanced. Check the run logs to see whether the next
            scheduled run will retry the same comedian or move on.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
