name: Post to Instagram

on:
  # Staggered schedule: every 6 hours starting Monday 4pm CT (22:00 UTC)
  # Mon 4pm CT, Mon 10pm CT, Tue 4am CT, Tue 10am CT, Tue 4pm CT, ...
  # 4pm CDT = 21:00 UTC, 4pm CST = 22:00 UTC — using 22:00 to cover both
  schedule:
    - cron: '0 4,10,16,22 * * *'  # Every 6 hours, daily

  # Manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write

# Critical: the 6-hour cron + manual_dispatch could otherwise double-fire and
# both runs would mutate ig-post-state.json + race to push main. Serialize.
concurrency:
  group: post-to-instagram
  cancel-in-progress: false

env:
  TZ: America/Chicago

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    # Hard cap so a hung node process can never burn unbounded CI time and —
    # more importantly — can never block the Commit state step from running
    # on the next scheduled run. Budget breakdown:
    #   4 channels × 3 min per-channel timeout (IG_CHANNEL_TIMEOUT_MS=180000)
    #   = 12 min worst case + setup/commit overhead → 25 min job cap.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if manifest exists
        id: check
        run: |
          if [ ! -f blog/comedians/manifest.json ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No manifest.json found — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post next comedian to Instagram
        if: steps.check.outputs.skip != 'true'
        # Step-level cap: if the node process ever fails to exit cleanly,
        # kill it so the Commit state step still runs. Must be > sum of
        # per-channel timeouts (4 × 3 min = 12 min) plus headroom.
        timeout-minutes: 18
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          # Tighten per-channel timeout from default 5 min → 3 min so that
          # all four channels can finish within the step timeout above.
          IG_CHANNEL_TIMEOUT_MS: '180000'
        run: node scripts/post-to-instagram.js

      - name: Commit updated state file
        # always() so that even if the post step times out or errors after
        # saveState() has already written ig-post-state.json, we still
        # commit/push the advancement and avoid reposting the same comedian.
        if: always() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/comedians/ig-post-state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Instagram post — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
            # Retry push up to 4 times (handles concurrent workflow runs)
            for i in 1 2 3 4; do
              echo "Push attempt $i…"
              git pull --rebase origin main --no-edit 2>/dev/null || {
                echo "Rebase conflict — resetting and re-applying."
                git rebase --abort 2>/dev/null || true
                git reset --soft HEAD~1
                git stash
                git pull origin main
                git stash pop
                git add blog/comedians/ig-post-state.json
                git commit -m "Instagram post — $(TZ=America/Chicago date +'%B %d, %Y %I:%M %p CT')"
              }
              if git push origin main; then
                echo "Push succeeded on attempt $i."
                break
              fi
              echo "Push failed, retrying in ${i}s…"
              sleep $i
            done
          fi

  # Failure notification lives in its OWN job. GitHub downloads every action a
  # job references during "Set up job" — BEFORE any step runs — so a third-party
  # action that fails to download (e.g. a moved/unservable tag) aborts the whole
  # job at setup, even when it's only meant to run on failure. Keeping the email
  # action out of the posting job guarantees a broken notifier can never block
  # posting. This job only spins up when post-to-instagram fails.
  notify-failure:
    needs: post-to-instagram
    if: failure()
    runs-on: ubuntu-latest
    steps:
      # Send the alert via curl's built-in SMTP support rather than a
      # third-party action. curl ships on every ubuntu-latest runner, so there
      # is no action archive to download and nothing that a moved/unservable
      # upstream tag can break — the exact failure mode that took posting down.
      - name: Notify on failure (SMTP via curl)
        if: env.HAS_SMTP == 'true'
        env:
          HAS_SMTP: ${{ secrets.SMTP_SERVER != '' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "From: ${SMTP_FROM}"
            echo "To: ${NOTIFY_EMAIL}"
            echo "Subject: [Comedy Houston] post-to-instagram FAILED"
            echo "Content-Type: text/plain; charset=UTF-8"
            echo
            echo "The post-to-instagram workflow failed. The state file may or may"
            echo "not have advanced — check the run logs to see whether the next"
            echo "scheduled run will retry the same comedian or move on."
            echo
            echo "Run: ${RUN_URL}"
          } > "${RUNNER_TEMP}/ig-failure-email.txt"

          # Port 465 = implicit TLS (smtps://); 587/25 = STARTTLS (smtp:// + --ssl-reqd).
          if [ "${SMTP_PORT}" = "465" ]; then
            URL="smtps://${SMTP_SERVER}:${SMTP_PORT}"
          else
            URL="smtp://${SMTP_SERVER}:${SMTP_PORT}"
          fi

          curl --silent --show-error --fail --ssl-reqd \
            --url "${URL}" \
            --user "${SMTP_USERNAME}:${SMTP_PASSWORD}" \
            --mail-from "${SMTP_FROM}" \
            --mail-rcpt "${NOTIFY_EMAIL}" \
            --upload-file "${RUNNER_TEMP}/ig-failure-email.txt"
          echo "Failure notification email sent."
